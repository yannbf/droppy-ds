name: Chromatic

on: push

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic compares against baselines from git history, so it
          # needs more than the default shallow clone.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          # TurboSnap: only snapshot stories whose module graph the push
          # touched. Two kinds of files affect rendering without appearing
          # in the dependency trace — treat them as external so edits still
          # snapshot everything:
          # - token JSON, consumed through the swatchbook preset's virtual
          #   module;
          # - pnpm patches, which change installed package code while the
          #   lockfile keeps the same package version.
          onlyChanged: true
          externals: |
            src/theme/tokens/**
            patches/**
            pnpm-workspace.yaml
