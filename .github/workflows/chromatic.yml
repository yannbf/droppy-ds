name: Chromatic

on: push

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic compares against baselines from git history, so it
          # needs more than the default shallow clone.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          # TurboSnap: only snapshot stories whose module graph the push
          # touched. Token JSON is consumed through the swatchbook preset's
          # virtual module, which the dependency trace can't see — treat it
          # as external so token edits still snapshot everything.
          onlyChanged: true
          externals: src/theme/tokens/**
